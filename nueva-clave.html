<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hazlo Ahora · Nueva contraseña</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FBF8F4; --ink: #211D1A; --muted: #6E655D; --line: #EEE6DC; --brand: #FF6B2C; --brand-ink: #B8430F; --ok: #1F8A4C; --bad: #C0392B; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  .card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; box-shadow: 0 8px 30px rgba(33,29,26,.06); }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: var(--brand); color: #fff; font-weight: 800; font-size: 26px; display: grid; place-items: center; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 6px; } p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 12px 0 6px; }
  input { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
  button { width: 100%; margin-top: 16px; font: inherit; font-weight: 800; padding: 13px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: #FFF1E9; color: var(--brand-ink); }
  .msg.bad { background: #FBE4E1; color: var(--bad); } .msg.ok { background: #E4F5EA; color: var(--ok); }
  .hidden { display: none; }
  .apps { margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">H</div>
  <h1>Crea tu contraseña nueva</h1>
  <p id="intro">Escribe una contraseña nueva para tu cuenta de Hazlo Ahora. Después vuelve a la app y entra con ella.</p>
  <form id="form">
    <label for="p1">Contraseña nueva</label>
    <input id="p1" type="password" minlength="8" autocomplete="new-password" required placeholder="Mín. 8: mayúscula, minúscula, número y símbolo">
    <label for="p2">Repite la contraseña</label>
    <input id="p2" type="password" minlength="8" autocomplete="new-password" required>
    <button id="btn" type="submit">Guardar contraseña</button>
  </form>
  <div id="msg" class="hidden"></div>
  <div class="apps hidden" id="listo">Ya puedes cerrar esta página y entrar en la app <b>Hazlo Ahora</b> o <b>Hazlo Ahora Pro</b> con tu contraseña nueva.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
  // Mismo proyecto y clave pública que la app. El enlace del correo trae un permiso temporal
  // (#access_token=…&type=recovery) que solo sirve para cambiar la contraseña de esa cuenta.
  const db = supabase.createClient('https://qimechlfblfmdvzspkmt.supabase.co', 'sb_publishable_TEAlP8dlpwr-7H7rrq1ICQ_13KFdG9m', {
    auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: false },
  });
  const $ = (s) => document.querySelector(s);
  const show = (text, kind) => { const m = $('#msg'); m.textContent = text; m.className = 'msg ' + (kind || ''); };

  let listo = false;
  function sinEnlace() {
    show('Este enlace no es válido o ya venció. En la app, toca "¿Olvidaste tu contraseña?" para pedir uno nuevo.', 'bad');
    $('#form').classList.add('hidden');
  }
  // Si el enlace venía con error (vencido, ya usado), Supabase lo deja en la dirección.
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (hash.get('error')) sinEnlace();

  db.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (session && !listo)) listo = true;
  });
  // Si en 4 s no llegó el permiso del enlace, se avisa.
  setTimeout(async () => {
    const { data } = await db.auth.getSession();
    if (!data.session && !listo) sinEnlace();
  }, 4000);

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = $('#p1').value, p2 = $('#p2').value;
    // Misma regla que Supabase: mínimo 8, con mayúscula, minúscula, número y símbolo.
    const falta = [];
    if (p1.length < 8) falta.push('al menos 8 caracteres');
    if (!/[A-Z]/.test(p1)) falta.push('una mayúscula');
    if (!/[a-z]/.test(p1)) falta.push('una minúscula');
    if (!/[0-9]/.test(p1)) falta.push('un número');
    if (!/[!@#$%^&*()_+\-=[\]{};'\\:"|<>?,./`~]/.test(p1)) falta.push('un símbolo (por ejemplo ! # $ . -)');
    if (falta.length) return show('A tu contraseña le falta ' + (falta.length === 1 ? falta[0] : falta.slice(0, -1).join(', ') + ' y ' + falta[falta.length - 1]) + '.', 'bad');
    if (p1 !== p2) return show('Las dos contraseñas no coinciden.', 'bad');
    $('#btn').disabled = true;
    try {
      const { data } = await db.auth.getSession();
      if (!data.session) throw new Error('sin sesión');
      const { error } = await db.auth.updateUser({ password: p1 });
      if (error) throw error;
      show('¡Listo! Tu contraseña quedó guardada.', 'ok');
      $('#form').classList.add('hidden');
      $('#intro').classList.add('hidden');
      $('#listo').classList.remove('hidden');
      await db.auth.signOut();
    } catch (err) {
      const m = String(err && err.message || err);
      if (/sin sesión|session/i.test(m)) sinEnlace();
      else if (/same password|different from the old/i.test(m)) show('Esa es la misma contraseña de antes. Elige una distinta.', 'bad');
      else if (/weak|at least|characters|character of each/i.test(m)) show('Elige una contraseña más segura: mínimo 8 caracteres, con mayúscula, minúscula, número y un símbolo.', 'bad');
      else show('No se pudo guardar la contraseña. Intenta de nuevo o pide un enlace nuevo desde la app.', 'bad');
      $('#btn').disabled = false;
    }
  });
</script>
</body>
</html>
